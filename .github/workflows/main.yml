name: Build Client (Windows)

on:
push:
pull_request:

jobs:
build:
runs-on: windows-latest

```
steps:
- name: Checkout source
  uses: actions/checkout@v4

# Cài DirectX SDK (June 2010)
- name: Install DirectX SDK
  run: |
    choco install directx-sdk -y

# Setup MSBuild
- name: Setup MSBuild
  uses: microsoft/setup-msbuild@v2

# Thêm biến môi trường cho DXSDK
- name: Set DXSDK_DIR
  run: |
    echo "DXSDK_DIR=C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\" >> $env:GITHUB_ENV

# Build project
- name: Build
  run: |
    msbuild client/client.vcxproj /p:Configuration=Release /p:Platform=Win32
```
